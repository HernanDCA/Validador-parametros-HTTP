<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Grillas ASCII</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8fafc;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: #059669;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #047857;
    }
    /* El elemento <pre> conserva los espacios en blanco y los saltos de línea \n */
    pre {
      background-color: #0f172a;
      color: #38bdf8;
      padding: 16px;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      line-height: 1.2;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Generador de Ventana ASCII</h2>

    <form id="formVentana">
      <div class="form-group">
        <label for="ancho">Ancho (mínimo 4):</label>
        <input type="number" id="ancho" min="4" value="6" required>
      </div>

      <div class="form-group">
        <label for="alto">Alto (mínimo 4):</label>
        <input type="number" id="alto" min="4" value="5" required>
      </div>

      <button type="submit">Generar Ventana</button>
    </form>

    <h3>Resultado:</h3>
    <pre id="resultado"></pre>
  </div>

  <!-- Vinculación del script externo -->
  <script src="script.js"></script>
</body>
</html>
